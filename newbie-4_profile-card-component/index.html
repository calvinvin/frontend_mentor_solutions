<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Profile card component</title>
  </head>
  <body>
    <main class="main">
      <div class="profile-card-component">
        <img
          class="avatar"
          src="./images/image-victor.jpg"
          alt="Victor Crest's avatar photo"
        />
        <div class="person">
          <h1 class="name">Victor Crest</h1>
          <p class="age">26</p>
        </div>
        <p class="location">London</p>
        <ul class="stats-list" role="list">
          <li class="stat">
            <p>80K</p>
            <h2>Followers</h2>
          </li>
          <li class="stat">
            <p>803K</p>
            <h2>Likes</h2>
          </li>
          <li class="stat">
            <p>1.4K</p>
            <h2>Photos</h2>
          </li>
        </ul>
      </div>
      <div class="background-pattern">
        <div class="background-img-wrapper">
          <img
            class="background-img top"
            src="./images/bg-pattern-top.svg"
            alt=""
          />
        </div>
        <div class="background-img-wrapper">
          <img
            class="background-img bottom"
            src="./images/bg-pattern-bottom.svg"
            alt=""
          />
        </div>
      </div>
    </main>
  </body>
</html>
