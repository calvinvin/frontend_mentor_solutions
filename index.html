<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      * {
        margin: 0;
        padding: 0;
      }
      img {
        display: block;
        max-width: 100%;
      }
      [role="list"] {
        list-style: none;
      }
      a {
        color: currentColor;
      }
      body {
        padding: 32px;
        font-family: sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 1440px;
        margin-inline: auto;
      }
      main > * + * {
        margin-block-start: 2em;
      }
      form {
        display: grid;
        gap: 1em;
      }
      fieldset {
        padding: 0.5em;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5em 2em;
        border-radius: 4px;
      }
      label {
        display: flex;
        align-items: center;
      }
      label > input {
        margin-inline-end: 1em;
      }
      section.solutions {
        container-type: inline-size;
        & > header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          flex-wrap: wrap;
          gap: 8px 16px;
          & h2,
          & p {
            margin-inline-start: 0.5rem;
            & span#solutions-count {
              margin-inline-end: 1ch;
            }
          }
        }
      }
      div.solutions-wrapper {
        margin-block-start: 1em;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr));
        gap: 16px 32px;
        grid-auto-flow: dense;
      }
      article {
        padding: 0.5em;
        display: grid;
        grid-template-areas:
          "heading heading"
          "level time"
          "tags-wrapper tags-wrapper"
          "links-wrapper links-wrapper"
          "preview-img preview-img"
          "comments comments";
        grid-template-rows: subgrid;
        grid-row: span 6;
        border: 1px solid green;
        border-radius: 4px;
        & header {
          display: contents;
        }
        & h3 {
          grid-area: heading;
        }
        & time {
          grid-area: time;
          justify-self: end;
        }
        & p.level {
          grid-area: level;
        }
        & div.tags-wrapper {
          grid-area: tags-wrapper;
        }
        & ul {
          grid-area: links-wrapper;
        }
        & img.preview {
          grid-area: preview-img;
          max-height: 150px;
          margin-inline: auto;
        }
        & details {
          grid-area: comments;
          & ul,
          & ol {
            list-style-position: inside;
          }
          &[open] {
            & > * + * {
              margin-block-start: 1em;
            }
            & > * > * + * {
              margin-block-start: 0.5em;
            }
          }
        }
        @container (min-width: 400px) {
          &:has(summary) {
            grid-template-areas:
              "heading heading heading heading"
              "level tags-wrapper tags-wrapper time"
              "preview-img links-wrapper links-wrapper links-wrapper"
              "preview-img comments comments comments"
              "preview-img comments comments comments"
              "preview-img comments comments comments";
            grid-template-columns: repeat(4, 1fr);
            column-gap: 16px;
            /* background-color: lightpink; */
            grid-column: span 2;
          }
        }
      }

      div.tags-wrapper {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5em;
        & p {
          padding: 0.125em 0.5em;
          background-color: darkcyan;
          border-radius: 2px;
        }
      }

      ul.links-wrapper {
        display: flex;
        justify-content: space-evenly;
        flex-wrap: wrap;
        gap: 0.5em 2em;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Calvin's Frontend Mentor Challenge Solutions</h1>
      <details>
        <summary>Filter options</summary>
        <form id="filter-form" action="">
          <fieldset class="categories">
            <legend>Filter with Category:</legend>
            <template id="template-category-filter-input">
              <label><input type="radio" name="category" value="" /></label>
            </template>
          </fieldset>
          <fieldset class="tags">
            <legend>Filter with Tag:</legend>
            <template id="template-tag-filter-input">
              <label><input type="checkbox" name="tags" value="" /></label>
            </template>
          </fieldset>
        </form>
      </details>
      <section class="solutions" aria-labelledby="solutions-section-heading">
        <header>
          <h2 id="solutions-section-heading">
            <span id="solutions-count"></span>Solutions of
            <span id="current-category">All</span>
          </h2>
          <p><span id="current-tags"></span></p>
        </header>
        <div class="solutions-wrapper">
          <template id="template-challenge-solution">
            <article
              class="solution"
              id=""
              data-category=""
              data-level=""
              data-tags=""
            >
              <header>
                <h3></h3>
                <time datetime=""></time>
                <p class="level"></p>
                <div class="tags-wrapper">
                  <p class="tag"></p>
                </div>
              </header>
              <ul class="links-wrapper" role="list">
                <li><a class="link website" href="">Website</a></li>
                <li><a class="link repository" href="">Repository</a></li>
              </ul>
              <img class="preview" src="" alt="" />
              <details class="solutions-wrapper__coments">
                <summary>Comments</summary>
              </details>
            </article>
          </template>
        </div>
      </section>
    </main>
    <script>
      function articleElementId(challenge) {
        return `challenge-${challenge.id}`;
      }
      function capitalize(string) {
        return string.at(0).toUpperCase() + string.slice(1);
      }
      async function renderJSON(json, elements) {
        const response = await fetch(json);
        if (!response.ok) {
          throw Error(`Cannot fetch JSON: ${json}`);
        }
        const data = await response.json();
        renderData(data, elements);
      }
      class Components {
        static InputFilter(filterName, templateElement) {
          const clonedTemplateElement = templateElement.content.cloneNode(true);
          clonedTemplateElement.querySelector("input").value = filterName;
          clonedTemplateElement
            .querySelector("input")
            .toggleAttribute("checked", filterName === "All");
          clonedTemplateElement
            .querySelector("label")
            .append(capitalize(filterName));
          return clonedTemplateElement;
        }

        static Solution(challenge) {
          const {
            id,
            category,
            categoryName,
            name,
            createdAt,
            level,
            levelName,
            tags,
            websiteUrl,
            repositoryUrl,
            previewImgUrl,
            comments,
          } = challenge;
          const challengeTemplate = document.getElementById(
            "template-challenge-solution"
          );
          const clonedChallengeTemplate =
            challengeTemplate.content.cloneNode(true);
          clonedChallengeTemplate.querySelector("article").id =
            articleElementId(challenge);
          clonedChallengeTemplate
            .querySelector("article")
            .setAttribute("data-category", categoryName);
          clonedChallengeTemplate
            .querySelector("article")
            .setAttribute("data-level", levelName);
          clonedChallengeTemplate
            .querySelector("article")
            .setAttribute("data-tags", tags.join(","));
          clonedChallengeTemplate.querySelector("h3").textContent = name;
          clonedChallengeTemplate
            .querySelector("time")
            .setAttribute("datetime", createdAt);
          clonedChallengeTemplate.querySelector("time").textContent = createdAt;
          clonedChallengeTemplate.querySelector("p.level").textContent =
            capitalize(levelName);
          const tagElement = clonedChallengeTemplate
            .querySelector("p.tag")
            .cloneNode(true);
          clonedChallengeTemplate.querySelector("div.tags-wrapper").innerHTML =
            "";
          clonedChallengeTemplate.querySelector("div.tags-wrapper").append(
            ...tags.map((tag) => {
              const clonedTagElement = tagElement.cloneNode(true);
              clonedTagElement.textContent = capitalize(tag);
              return clonedTagElement;
            })
          );
          clonedChallengeTemplate.querySelector("a.link.website").href =
            websiteUrl;
          clonedChallengeTemplate.querySelector("a.link.repository").href =
            repositoryUrl;
          clonedChallengeTemplate.querySelector("img.preview").src =
            previewImgUrl;
          if (comments !== "") {
            clonedChallengeTemplate.querySelector("details").innerHTML +=
              comments;
          } else {
            clonedChallengeTemplate.querySelector("details").remove();
          }
          return clonedChallengeTemplate;
        }
      }
      function renderData(data, elements) {
        let { categories, levels, challenges } = data;
        const solutions = challenges.map((challenge) => {
          return {
            ...challenge,
            categoryName: categories[challenge.category],
            levelName: levels[challenge.level],
          };
        });
        categories = Object.values(categories);
        const tags = solutions.reduce((tagsArray, solution) => {
          return [
            ...tagsArray,
            ...solution.tags.filter((tagName) => !tagsArray.includes(tagName)),
          ];
        }, []);
        elements.element.spanSolutionsCount.textContent = solutions.length;
        renderFilterInputs({ categories: categories, tags: tags }, elements);
        renderSolutions(solutions, elements.container.divSolutions);
        elements.element.articlesSolution =
          document.querySelectorAll("article.solution");
      }

      function renderFilterInputs({ categories, tags }, elements) {
        elements.container.fieldsetCategories.append(
          ...categories.map((categoryName) =>
            Components.InputFilter(
              categoryName,
              elements.template.inputFilterCategory
            )
          ),
          Components.InputFilter("All", elements.template.inputFilterCategory)
        );
        elements.container.fieldsetTags.append(
          ...tags.map((tagName) =>
            Components.InputFilter(tagName, elements.template.inputFilterTag)
          )
        );
      }

      function renderSolutions(solutions, containerElement) {
        const solutionElements = solutions.map((solution) =>
          Components.Solution(solution)
        );
        containerElement.append(...solutionElements);
      }

      const jsonURL = "./frontend-mentor-solutions.json";
      const elements = {
        container: {
          divSolutions: document.querySelector("div.solutions-wrapper"),
          fieldsetCategories: document
            .getElementById("template-category-filter-input")
            .closest("fieldset"),
          fieldsetTags: document
            .getElementById("template-tag-filter-input")
            .closest("fieldset"),
        },
        template: {
          articleSolution: document.getElementById(
            "template-challenge-solution"
          ),
          inputFilterCategory: document.getElementById(
            "template-category-filter-input"
          ),
          inputFilterTag: document.getElementById("template-tag-filter-input"),
        },
        element: {
          spanSolutionsCount: document.getElementById("solutions-count"),
          spanCurrentCategory: document.getElementById("current-category"),
          spanCurrentTags: document.getElementById("current-tags"),
        },
      };

      function filterArticles(e) {
        const checkedCategory = e.target.form.category.value;
        const checkedTagValues = Array.from(e.target.form.tags)
          .filter((tag) => tag.checked === true)
          .map((tag) => tag.value);
        elements.element.spanCurrentCategory.textContent = checkedCategory;
        elements.element.spanCurrentTags.textContent =
          checkedTagValues.length === 0
            ? ""
            : `filtered with ${checkedTagValues.join(", ")}`;
        elements.element.articlesSolution.forEach((articleElement) =>
          articleElement.toggleAttribute(
            "hidden",
            !(
              matchCategory(articleElement, checkedCategory) &&
              matchTags(articleElement, checkedTagValues)
            )
          )
        );
        elements.element.spanSolutionsCount.textContent = Array.from(
          elements.element.articlesSolution
        ).filter(
          (articleElement) => !articleElement.hasAttribute("hidden")
        ).length;

        function matchCategory(articleElement, checkedCategory) {
          return (
            checkedCategory === "All" ||
            articleElement.getAttribute("data-category").toLowerCase() ===
              checkedCategory.toLowerCase()
          );
        }

        function matchTags(articleElement, checkedTagValues) {
          return checkedTagValues.every((checkedTagValue) =>
            articleElement
              .getAttribute("data-tags")
              .split(",")
              .map((x) => x.toLowerCase())
              .includes(checkedTagValue.toLowerCase())
          );
        }
      }
      document
        .getElementById("filter-form")
        .addEventListener("change", filterArticles);

      renderJSON(jsonURL, elements);
    </script>
  </body>
</html>
