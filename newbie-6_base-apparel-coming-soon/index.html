<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Base Apparel coming soon page</title>
  </head>
  <body>
    <div class="grid-layout">
      <header class="logo">
        <img class="logo-img" src="./images/logo.svg" alt="" />
      </header>
      <main class="main">
        <div class="hero-image">
          <picture class="hero-image__picture">
            <source
              srcset="./images/hero-desktop.jpg"
              media="(min-width: 860px)"
            />
            <img
              src="./images/hero-mobile.jpg"
              alt=""
              class="hero-image__img"
            />
          </picture>
        </div>
        <div class="hero">
          <h1 class="hero__heading">We're <strong>coming soon</strong></h1>
          <p class="hero__description">
            Hello fellow shoppers! We're currently building our new fashion
            store. Add your email below to stay up-to-date with announcements
            and our launch deals.
          </p>
          <form class="form">
            <div class="form__wrapper">
              <div class="form__input-wrapper">
                <input
                  class="form__email"
                  name="email"
                  type="email"
                  placeholder="Email Address"
                />
                <img
                  src="./images/icon-error.svg"
                  alt=""
                  class="form__error-icon"
                />
                <p class="form__error-message">Please provide a valid email</p>
              </div>
              <button class="form__submit-button">
                <img src="./images/icon-arrow.svg" alt="" />
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
