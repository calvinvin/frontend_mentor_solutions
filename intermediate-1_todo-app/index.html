          <h1 class="header__heading">Todo</h1>
          <button

            class="color-theme-wrapper button"
          >
            <span class="visually-hidden">Switch color scheme</span>

        <div class="create-todo-wrapper row">
          <div class="create-todo__circle circle"></div>
          <form id="create-todo__form" class="create-todo__form">
            <input
              class="create-todo__input"
              type="text"
              name="todo"
              placeholder="Create a new todo..."
            />
          </form>
        </div>

                id=""
                data-number=""
                data-status="active"
                draggable="true"
                ondragstart="handleDragStart(event)"
                ondragover="handleDragOver(event)"
                ondrop="handleDrop(event)"
              >
                <button class="todo-item__status-wrapper button circle">
                  <svg
                    class="todo-item__status-svg"
                    xmlns="http://www.w3.org/2000/svg"
                    width="11"
                    height="9"
                  >
                    <path
                      fill="none"
                      stroke="#FFF"
                      stroke-width="2"
                      d="M1 4.304L3.696 7l6-6"
                    />
                  </svg>
                </button>
                <p class="todo-item__description"></p>
                <button class="todo-item__delete-wrapper button">
                  <svg
                    class="todo-item__delete-svg"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 18 18"

                    />
                  </svg>
                </button>
              </li>

          <div class="wrapper status-bar-wrapper row" data-content="status-bar">
            <p class="item-amount">
              <span id="item-amount__number"></span> items left
            </p>
            <form class="todo-filter-form desktop">
              <menu class="todo-filter-list desktop" role="list">
                <li>
                  <label class="todo-filter__label">
                    All
                    <input
                      class="visually-hidden"
                      name="todo-filter"
                      value="all"
                      type="radio"
                      checked
                    />
                  </label>
                </li>
                <li>
                  <label class="todo-filter__label">
                    Active
                    <input
                      class="visually-hidden"
                      name="todo-filter"
                      value="active"
                      type="radio"
                    />
                  </label>
                </li>
                <li>
                  <label class="todo-filter__label">
                    Completed
                    <input
                      class="visually-hidden"
                      name="todo-filter"
                      value="completed"
                      type="radio"
                    />
                  </label>
                </li>
              </menu>
            </form>
            <button
              id="clear-completed-button"
              class="clear-completed-button button"
            >
              Clear Completed
            </button>
          </div>
        </div>
        <form class="todo-filter-form mobile">
