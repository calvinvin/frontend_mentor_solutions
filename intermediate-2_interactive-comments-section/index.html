<html lang="en">

    <meta charset="UTF-8" />

    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Frontend Mentor | Interactive comments section</title>

  <body>
    <template id="template-edit-form">
      <form class="edit-form__form">
        <div class="wrapper" data-content="edit-comment">
          <input type="text" name="replying-to" hidden />
          <input type="text" name="post-id" hidden />
          <textarea
            class="edit-comment__textarea"
            name="edited-content"
          ></textarea>
          <button class="edit-comment__submit-button">update</button>
        </div>
      </form>
    </template>
    <template id="template-reply-form">
      <form class="new-comment__form reply-form">
        <div class="wrapper" data-content="new-comment" data-type="reply-reply">
          <input
            class="current-user"
            type="text"
            name="author"
            value=""
            hidden
          />
          <input type="text" name="origin-post-id" value="" hidden />
          <input type="text" name="replying-to" value="" hidden />
          <img class="new-comment__avatar avatar current-user" src="" alt="" />
          <textarea
            class="new-comment__textarea"
            name="comment"
            placeholder="Add a comment..."
          ></textarea>
          <button class="new-comment__submit-button">Reply</button>
        </div>
      </form>
    </template>
    <template id="template-article">
      <article data-id="" data-is-author="">
        <div class="wrapper" data-content="article" data-type="">
          <div class="wrapper" data-content="score">
            <button class="score__button plus" data-function="plus-score">
              <svg
                width="11"
                height="11"

                aria-hidden="true"

              <span class="visually-hidden">minus score</span>
            </button>
          </div>
          <div class="wrapper" data-content="metadata">
            <img class="metadata__avatar avatar" src="" alt="" />
            <div class="metadata__author-wrapper">
              <h2 class="metadata__author"></h2>
              <p class="metadata__author-tag">you</p>
            </div>
            <p class="metadata__date"></p>
          </div>
          <div class="wrapper" data-content="menu">
            <button class="menu__button reply" data-function="reply">

          </div>

      </article>
    </template>
    <template id="template-comment-list-item">
      <li>
        <div class="wrapper" data-content="comment"></div>
      </li>
    </template>
    <template id="template-replies-wrapper">
      <div class="wrapper" data-content="replies">
        <div class="decoration-sideline"></div>
        <div class="wrapper" data-content="reply-articles"></div>
      </div>
    </template>
    <template id="template-user-option">
      <option value=""></option>
    </template>
    <template id="template-log-options">
      <option value="" id="log-in-option">Choose to Log in</option>
      <option value="" id="log-out-option">Select to Log out</option>
    </template>

            </div>
          </form>
          <img class="user__avatar avatar current-user" src="" alt="" />
        </div>
